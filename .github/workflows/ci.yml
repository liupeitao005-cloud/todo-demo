name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run backend tests
        run: |
          mvn test || {
            echo "==== Surefire reports ===="
            find target/surefire-reports -type f -name "*.txt" -print -exec cat {} \;
            exit 1
          }

  frontend:
    name: Frontend Tests And Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/main/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-security:
    name: Backend Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          NVD_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            NVD_ARGS="-DnvdApiKey=$NVD_API_KEY"
          fi

          mvn -B org.owasp:dependency-check-maven:12.2.2:check \
            -DfailBuildOnCVSS=7 \
            -Dformat=ALL \
            $NVD_ARGS

      - name: Upload OWASP Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: ignore
