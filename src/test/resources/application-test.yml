spring:
  datasource:
    url: jdbc:h2:mem:todo_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: todo-test-jwt-secret-key-must-be-at-least-32-bytes

todo:
  xxl-job:
    enabled: false
    access-token: todo-test-xxl-job-token
