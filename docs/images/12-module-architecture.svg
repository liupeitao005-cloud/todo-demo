<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>.bg{fill:#f6f9fe}.title{font:700 34px Arial,"Microsoft YaHei",sans-serif;fill:#102033}.sub{font:400 16px Arial,"Microsoft YaHei",sans-serif;fill:#607089}.box{fill:#fff;stroke:#d9e3f0;stroke-width:2;rx:18}.head{font:700 22px Arial,"Microsoft YaHei",sans-serif;fill:#102033}.text{font:400 16px Arial,"Microsoft YaHei",sans-serif;fill:#40506b}.pill{fill:#eef4ff}.pill2{fill:#ecfdf5}.line{stroke:#8fa4c1;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font:700 14px Arial,"Microsoft YaHei",sans-serif;fill:#607089}</style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#8fa4c1"/></marker></defs>
  <rect class="bg" width="1440" height="900"/><text class="title" x="60" y="68">模块架构图</text><text class="sub" x="60" y="100">Vue 前端通过 Axios 访问 Spring Boot 接口，后端经过 Controller、Service、Mapper 持久化到 MySQL，并接入 Redis、RabbitMQ、XXL-JOB 与提醒扫描。</text>
  <g transform="translate(70,170)"><rect class="box" width="270" height="300"/><text class="head" x="28" y="46">前端 Vue</text><rect class="pill" x="28" y="76" width="214" height="38" rx="10"/><text class="text" x="44" y="101">views 页面</text><rect class="pill" x="28" y="126" width="214" height="38" rx="10"/><text class="text" x="44" y="151">components 可复用组件</text><rect class="pill" x="28" y="176" width="214" height="38" rx="10"/><text class="text" x="44" y="201">composables 业务状态</text><rect class="pill" x="28" y="226" width="214" height="38" rx="10"/><text class="text" x="44" y="251">api / router / layouts</text></g>
  <g transform="translate(430,170)"><rect class="box" width="270" height="300"/><text class="head" x="28" y="46">接口层</text><rect class="pill2" x="28" y="76" width="214" height="38" rx="10"/><text class="text" x="44" y="101">Controller</text><rect class="pill2" x="28" y="126" width="214" height="38" rx="10"/><text class="text" x="44" y="151">DTO 校验</text><rect class="pill2" x="28" y="176" width="214" height="38" rx="10"/><text class="text" x="44" y="201">登录拦截器</text><rect class="pill2" x="28" y="226" width="214" height="38" rx="10"/><text class="text" x="44" y="251">全局异常处理</text></g>
  <g transform="translate(790,170)"><rect class="box" width="270" height="300"/><text class="head" x="28" y="46">业务层</text><rect class="pill" x="28" y="76" width="214" height="38" rx="10"/><text class="text" x="44" y="101">User / Backlog</text><rect class="pill" x="28" y="126" width="214" height="38" rx="10"/><text class="text" x="44" y="151">Task / Schedule</text><rect class="pill" x="28" y="176" width="214" height="38" rx="10"/><text class="text" x="44" y="201">Habit / Review / Four</text><rect class="pill" x="28" y="226" width="214" height="38" rx="10"/><text class="text" x="44" y="251">Reminder Service</text></g>
  <g transform="translate(1150,170)"><rect class="box" width="220" height="300"/><text class="head" x="28" y="46">数据访问</text><rect class="pill2" x="28" y="76" width="164" height="38" rx="10"/><text class="text" x="44" y="101">Mapper</text><rect class="pill2" x="28" y="126" width="164" height="38" rx="10"/><text class="text" x="44" y="151">MyBatis</text><rect class="pill2" x="28" y="176" width="164" height="38" rx="10"/><text class="text" x="44" y="201">SQL Schema</text></g>
  <path class="line" d="M340 320H430"/><text class="label" x="360" y="300">Axios</text><path class="line" d="M700 320H790"/><text class="label" x="724" y="300">Service 调用</text><path class="line" d="M1060 320H1150"/><text class="label" x="1082" y="300">Mapper</text>
  <g transform="translate(170,600)"><rect class="box" width="250" height="150"/><text class="head" x="28" y="46">MySQL 8</text><text class="text" x="28" y="86">业务表、XXL-JOB 表</text></g><g transform="translate(475,600)"><rect class="box" width="250" height="150"/><text class="head" x="28" y="46">Redis</text><text class="text" x="28" y="86">缓存与扩展能力</text></g><g transform="translate(780,600)"><rect class="box" width="250" height="150"/><text class="head" x="28" y="46">RabbitMQ</text><text class="text" x="28" y="86">提醒消息队列</text></g><g transform="translate(1085,600)"><rect class="box" width="250" height="150"/><text class="head" x="28" y="46">XXL-JOB</text><text class="text" x="28" y="86">提醒扫描任务</text></g>
  <path class="line" d="M1260 470V590"/><path class="line" d="M920 470V590"/><path class="line" d="M565 470V590"/><path class="line" d="M1260 470C920 540 520 540 295 590"/>
</svg>
