<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <style>.bg{fill:#f7fbff}.title{font:700 34px Arial,"Microsoft YaHei",sans-serif;fill:#102033}.sub{font:400 16px Arial,"Microsoft YaHei",sans-serif;fill:#607089}.card{fill:#fff;stroke:#dce6f2;stroke-width:2;rx:16}.head{font:700 20px Arial,"Microsoft YaHei",sans-serif;fill:#102033}.api{font:700 15px Consolas,monospace;fill:#26364f}.muted{font:400 14px Arial,"Microsoft YaHei",sans-serif;fill:#607089}.get{fill:#16a765}.post{fill:#2f6df6}.put{fill:#f59e0b}.del{fill:#ef4444}.pillText{font:700 12px Arial,sans-serif;fill:#fff}</style>
  <rect class="bg" width="1440" height="960"/><text class="title" x="56" y="64">接口文档总览</text><text class="sub" x="56" y="96">完整可交互文档：启动后端后访问 http://localhost:8080/swagger-ui/index.html；除注册登录外请求头携带 token。</text>
  <g transform="translate(56,135)"><rect class="card" width="300" height="210"/><text class="head" x="22" y="38">用户</text><rect class="post" x="22" y="62" width="48" height="22" rx="6"/><text class="pillText" x="31" y="78">POST</text><text class="api" x="82" y="78">/user/register</text><rect class="post" x="22" y="98" width="48" height="22" rx="6"/><text class="pillText" x="31" y="114">POST</text><text class="api" x="82" y="114">/user/login</text><text class="muted" x="22" y="160">登录成功返回 JWT token。</text></g>
  <g transform="translate(396,135)"><rect class="card" width="300" height="210"/><text class="head" x="22" y="38">待办箱</text><rect class="post" x="22" y="62" width="48" height="22" rx="6"/><text class="pillText" x="31" y="78">POST</text><text class="api" x="82" y="78">/backlog/create</text><rect class="put" x="22" y="96" width="48" height="22" rx="6"/><text class="pillText" x="36" y="112">PUT</text><text class="api" x="82" y="112">/backlog/update</text><rect class="post" x="22" y="130" width="48" height="22" rx="6"/><text class="pillText" x="31" y="146">POST</text><text class="api" x="82" y="146">/backlog/move</text><rect class="del" x="22" y="164" width="48" height="22" rx="6"/><text class="pillText" x="27" y="180">DEL</text><text class="api" x="82" y="180">/backlog/delete</text></g>
  <g transform="translate(736,135)"><rect class="card" width="300" height="260"/><text class="head" x="22" y="38">任务</text><rect class="post" x="22" y="62" width="48" height="22" rx="6"/><text class="pillText" x="31" y="78">POST</text><text class="api" x="82" y="78">/task/create</text><rect class="put" x="22" y="96" width="48" height="22" rx="6"/><text class="pillText" x="36" y="112">PUT</text><text class="api" x="82" y="112">/task/update</text><rect class="del" x="22" y="130" width="48" height="22" rx="6"/><text class="pillText" x="27" y="146">DEL</text><text class="api" x="82" y="146">/task/delete</text><rect class="put" x="22" y="164" width="48" height="22" rx="6"/><text class="pillText" x="36" y="180">PUT</text><text class="api" x="82" y="180">/task/finish</text><rect class="put" x="22" y="198" width="48" height="22" rx="6"/><text class="pillText" x="36" y="214">PUT</text><text class="api" x="82" y="214">/task/split / goout / next</text></g>
  <g transform="translate(1076,135)"><rect class="card" width="300" height="210"/><text class="head" x="22" y="38">行程 / 日历</text><rect class="post" x="22" y="62" width="48" height="22" rx="6"/><text class="pillText" x="31" y="78">POST</text><text class="api" x="82" y="78">/schedule/create</text><rect class="put" x="22" y="96" width="48" height="22" rx="6"/><text class="pillText" x="36" y="112">PUT</text><text class="api" x="82" y="112">/schedule/update</text><rect class="get" x="22" y="130" width="48" height="22" rx="6"/><text class="pillText" x="33" y="146">GET</text><text class="api" x="82" y="146">/calendar/select</text><rect class="get" x="22" y="164" width="48" height="22" rx="6"/><text class="pillText" x="33" y="180">GET</text><text class="api" x="82" y="180">/schedule/select</text></g>
  <g transform="translate(56,455)"><rect class="card" width="300" height="230"/><text class="head" x="22" y="38">习惯</text><rect class="post" x="22" y="62" width="48" height="22" rx="6"/><text class="pillText" x="31" y="78">POST</text><text class="api" x="82" y="78">/habbit/create</text><rect class="get" x="22" y="96" width="48" height="22" rx="6"/><text class="pillText" x="33" y="112">GET</text><text class="api" x="82" y="112">/habbit/select</text><rect class="get" x="22" y="130" width="48" height="22" rx="6"/><text class="pillText" x="33" y="146">GET</text><text class="api" x="82" y="146">/habbit/checks</text><rect class="put" x="22" y="164" width="48" height="22" rx="6"/><text class="pillText" x="36" y="180">PUT</text><text class="api" x="82" y="180">/habbit/check/toggle</text></g>
  <g transform="translate(396,455)"><rect class="card" width="300" height="230"/><text class="head" x="22" y="38">四象限</text><rect class="post" x="22" y="62" width="48" height="22" rx="6"/><text class="pillText" x="31" y="78">POST</text><text class="api" x="82" y="78">/four/move</text><rect class="get" x="22" y="96" width="48" height="22" rx="6"/><text class="pillText" x="33" y="112">GET</text><text class="api" x="82" y="112">/four/select</text><rect class="del" x="22" y="130" width="48" height="22" rx="6"/><text class="pillText" x="27" y="146">DEL</text><text class="api" x="82" y="146">/four/delete</text><text class="muted" x="22" y="190">按重要性和紧急性管理任务。</text></g>
  <g transform="translate(736,455)"><rect class="card" width="300" height="230"/><text class="head" x="22" y="38">复习计划</text><rect class="post" x="22" y="62" width="48" height="22" rx="6"/><text class="pillText" x="31" y="78">POST</text><text class="api" x="82" y="78">/review/create</text><rect class="put" x="22" y="96" width="48" height="22" rx="6"/><text class="pillText" x="36" y="112">PUT</text><text class="api" x="82" y="112">/review/finish</text><rect class="get" x="22" y="130" width="48" height="22" rx="6"/><text class="pillText" x="33" y="146">GET</text><text class="api" x="82" y="146">/review/plans</text><text class="muted" x="22" y="190">创建后自动生成多次复习节点。</text></g>
  <g transform="translate(1076,455)"><rect class="card" width="300" height="230"/><text class="head" x="22" y="38">提醒</text><rect class="post" x="22" y="62" width="48" height="22" rx="6"/><text class="pillText" x="31" y="78">POST</text><text class="api" x="82" y="78">/reminder/create</text><rect class="get" x="22" y="96" width="48" height="22" rx="6"/><text class="pillText" x="33" y="112">GET</text><text class="api" x="82" y="112">/reminder/select</text><rect class="get" x="22" y="130" width="48" height="22" rx="6"/><text class="pillText" x="33" y="146">GET</text><text class="api" x="82" y="146">/reminder/pending</text><rect class="put" x="22" y="164" width="48" height="22" rx="6"/><text class="pillText" x="36" y="180">PUT</text><text class="api" x="82" y="180">/reminder/read</text></g>
  <rect class="card" x="56" y="760" width="1320" height="108"/><text class="head" x="84" y="802">鉴权与调试</text><text class="muted" x="84" y="836">注册、登录不需要 token；其他接口均需要请求头 token。Swagger UI 提供接口参数、响应结构和在线调试能力。</text>
</svg>
