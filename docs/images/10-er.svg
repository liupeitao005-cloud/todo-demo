<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <style>
    .bg{fill:#f6f9fe}.title{font:700 34px Arial,"Microsoft YaHei",sans-serif;fill:#102033}.sub{font:400 16px Arial,"Microsoft YaHei",sans-serif;fill:#607089}.box{fill:#fff;stroke:#d9e3f0;stroke-width:2;rx:14}.head{fill:#2f6df6}.head2{fill:#16a765}.head3{fill:#f59e0b}.head4{fill:#7c3aed}.h{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#fff}.t{font:400 15px Arial,"Microsoft YaHei",sans-serif;fill:#26364f}.k{font:700 15px Arial,"Microsoft YaHei",sans-serif;fill:#102033}.line{stroke:#8fa4c1;stroke-width:2;fill:none}.label{font:700 13px Arial,"Microsoft YaHei",sans-serif;fill:#607089}.note{font:400 14px Arial,"Microsoft YaHei",sans-serif;fill:#607089}
  </style>
  <rect class="bg" width="1440" height="960"/>
  <text class="title" x="60" y="70">Todo 系统 ER 图</text>
  <text class="sub" x="60" y="102">核心数据通过 user_id 归属到用户；复习计划关联复习任务；提醒通过 target_type + target_id 逻辑关联业务对象。</text>
  <g transform="translate(585,150)"><rect class="box" width="270" height="158"/><rect class="head" width="270" height="44" rx="14"/><text class="h" x="22" y="29">todo_user 用户</text><text class="k" x="22" y="74">id PK</text><text class="t" x="22" y="102">username</text><text class="t" x="22" y="130">password / create_time</text></g>
  <g transform="translate(90,400)"><rect class="box" width="245" height="176"/><rect class="head2" width="245" height="44" rx="14"/><text class="h" x="18" y="29">todo_backlog 待办</text><text class="k" x="18" y="74">id PK / user_id FK</text><text class="t" x="18" y="102">title / content</text><text class="t" x="18" y="130">is_delete</text><text class="t" x="18" y="158">create_time / update_time</text></g>
  <g transform="translate(395,400)"><rect class="box" width="270" height="214"/><rect class="head2" width="270" height="44" rx="14"/><text class="h" x="18" y="29">todo_task 任务</text><text class="k" x="18" y="74">id PK / user_id FK</text><text class="t" x="18" y="102">title / content / task_type</text><text class="t" x="18" y="130">parent_id</text><text class="t" x="18" y="158">start_time / finish_time</text><text class="t" x="18" y="186">is_finish / is_next</text></g>
  <g transform="translate(730,400)"><rect class="box" width="270" height="196"/><rect class="head2" width="270" height="44" rx="14"/><text class="h" x="18" y="29">todo_schedule 行程</text><text class="k" x="18" y="74">id PK / user_id FK</text><text class="t" x="18" y="102">title / content / location</text><text class="t" x="18" y="130">start_time / finish_time</text><text class="t" x="18" y="158">create_time / update_time</text></g>
  <g transform="translate(1070,400)"><rect class="box" width="270" height="176"/><rect class="head2" width="270" height="44" rx="14"/><text class="h" x="18" y="29">todo_habbit 习惯</text><text class="k" x="18" y="74">id PK / user_id FK</text><text class="t" x="18" y="102">title / content</text><text class="t" x="18" y="130">day/min/max minutes</text><text class="t" x="18" y="158">create_time / update_time</text></g>
  <g transform="translate(90,700)"><rect class="box" width="270" height="158"/><rect class="head3" width="270" height="44" rx="14"/><text class="h" x="18" y="29">todo_four 四象限</text><text class="k" x="18" y="74">id PK / user_id FK</text><text class="t" x="18" y="102">task_id / quadrant</text><text class="t" x="18" y="130">create_time / update_time</text></g>
  <g transform="translate(430,700)"><rect class="box" width="270" height="158"/><rect class="head4" width="270" height="44" rx="14"/><text class="h" x="18" y="29">todo_review_task</text><text class="k" x="18" y="74">id PK / user_id FK</text><text class="t" x="18" y="102">title / content</text><text class="t" x="18" y="130">create_time / update_time</text></g>
  <g transform="translate(760,700)"><rect class="box" width="270" height="176"/><rect class="head4" width="270" height="44" rx="14"/><text class="h" x="18" y="29">todo_reviewplan</text><text class="k" x="18" y="74">id PK / user_id FK</text><text class="t" x="18" y="102">review_task_id FK</text><text class="t" x="18" y="130">review_time / finish_time</text><text class="t" x="18" y="158">is_finish</text></g>
  <g transform="translate(1080,700)"><rect class="box" width="270" height="176"/><rect class="head3" width="270" height="44" rx="14"/><text class="h" x="18" y="29">todo_reminder 提醒</text><text class="k" x="18" y="74">id PK / user_id FK</text><text class="t" x="18" y="102">target_type / target_id</text><text class="t" x="18" y="130">remind_time / channel</text><text class="t" x="18" y="158">is_read / is_sent</text></g>
  <path class="line" d="M720 308V375"/><path class="line" d="M720 355H212V400M720 355H530V400M720 355H865V400M720 355H1205V400"/><path class="line" d="M530 614V670H225V700"/><path class="line" d="M720 308V665H565V700"/><path class="line" d="M700 780H760"/><path class="line" d="M720 308V655H1215V700"/>
  <text class="label" x="760" y="346">1 对多</text><text class="label" x="705" y="784">1 对多</text><text class="note" x="60" y="920">说明：todo_reminder 的 target_type 可为 task、schedule、review，target_id 指向对应业务记录。</text>
</svg>
