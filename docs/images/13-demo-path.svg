<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <style>.bg{fill:#f6f9fe}.title{font:700 34px Arial,"Microsoft YaHei",sans-serif;fill:#102033}.sub{font:400 16px Arial,"Microsoft YaHei",sans-serif;fill:#607089}.step{fill:#fff;stroke:#d9e3f0;stroke-width:2;rx:18}.num{fill:#2f6df6}.n{font:700 20px Arial,sans-serif;fill:#fff}.h{font:700 22px Arial,"Microsoft YaHei",sans-serif;fill:#102033}.t{font:400 15px Arial,"Microsoft YaHei",sans-serif;fill:#607089}.line{stroke:#8fa4c1;stroke-width:3;fill:none;marker-end:url(#arrow)}.ok{fill:#dcfce7;stroke:#16a765}.warn{fill:#fff7ed;stroke:#f59e0b}</style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#8fa4c1"/></marker></defs>
  <rect class="bg" width="1600" height="720"/><text class="title" x="56" y="66">完整演示路径</text><text class="sub" x="56" y="98">注册 → 登录 → 创建待办 → 安排任务 → 日历查看 → 设置提醒 → 完成任务</text>
  <g transform="translate(60,170)"><rect class="step" width="190" height="170"/><circle class="num" cx="38" cy="38" r="22"/><text class="n" x="32" y="45">1</text><text class="h" x="28" y="88">注册</text><text class="t" x="28" y="122">创建新用户</text><text class="t" x="28" y="148">或使用 demo 账号</text></g><path class="line" d="M250 255H318"/>
  <g transform="translate(320,170)"><rect class="step" width="190" height="170"/><circle class="num" cx="38" cy="38" r="22"/><text class="n" x="32" y="45">2</text><text class="h" x="28" y="88">登录</text><text class="t" x="28" y="122">获取 JWT token</text><text class="t" x="28" y="148">后续请求带 token</text></g><path class="line" d="M510 255H578"/>
  <g transform="translate(580,170)"><rect class="step" width="190" height="170"/><circle class="num" cx="38" cy="38" r="22"/><text class="n" x="32" y="45">3</text><text class="h" x="28" y="88">创建待办</text><text class="t" x="28" y="122">进入待办箱</text><text class="t" x="28" y="148">记录事项标题内容</text></g><path class="line" d="M770 255H838"/>
  <g transform="translate(840,170)"><rect class="step" width="190" height="170"/><circle class="num" cx="38" cy="38" r="22"/><text class="n" x="32" y="45">4</text><text class="h" x="28" y="88">安排任务</text><text class="t" x="28" y="122">填写开始/结束时间</text><text class="t" x="28" y="148">待办转为任务</text></g><path class="line" d="M1030 255H1098"/>
  <g transform="translate(1100,170)"><rect class="step" width="190" height="170"/><circle class="num" cx="38" cy="38" r="22"/><text class="n" x="32" y="45">5</text><text class="h" x="28" y="88">日历查看</text><text class="t" x="28" y="122">进入日历页</text><text class="t" x="28" y="148">确认任务按日期展示</text></g><path class="line" d="M1290 255H1358"/>
  <g transform="translate(1360,170)"><rect class="step warn" width="190" height="170"/><circle class="num" cx="38" cy="38" r="22"/><text class="n" x="32" y="45">6</text><text class="h" x="28" y="88">设置提醒</text><text class="t" x="28" y="122">系统自动生成</text><text class="t" x="28" y="148">提前 5 分钟提醒</text></g><path class="line" d="M1455 340V450H860"/>
  <g transform="translate(660,450)"><rect class="step ok" width="230" height="170"/><circle class="num" cx="38" cy="38" r="22"/><text class="n" x="32" y="45">7</text><text class="h" x="28" y="88">完成任务</text><text class="t" x="28" y="122">进入任务页点击完成</text><text class="t" x="28" y="148">重复点击返回明确提示</text></g>
  <g transform="translate(980,450)"><rect class="step" width="360" height="170"/><text class="h" x="28" y="54">验收重点</text><text class="t" x="28" y="92">能完整展示登录认证、待办管理、任务安排、</text><text class="t" x="28" y="122">日历聚合、提醒处理和任务完成幂等性。</text></g>
</svg>
